server {
    listen 80;
    server_name _;

    client_max_body_size 80M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

    location /static/ {
        alias /opt/comparador-ipasgo/app/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180;
    }
}

# Para ativar HTTPS, execute:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d <seu-dominio>
#
# O certbot sobrescreverá este arquivo e configurará TLS automaticamente.
# Após isso, substitua server_name _; pelo domínio real acima.
